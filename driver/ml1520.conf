# ML-1520 capabilities for ippeveprinter. With these, macOS sends finished 1-bit
# black and white raster at 600 dpi. Margins are the SpliX values (10.75 / 15 pt) in 1/100 mm.
ATTR text printer-make-and-model "Samsung ML-1520"
ATTR mimeMediaType document-format-supported image/pwg-raster,application/octet-stream
ATTR keyword pwg-raster-document-type-supported black_1
ATTR resolution pwg-raster-document-resolution-supported 600dpi
ATTR keyword print-color-mode-supported bi-level,monochrome
ATTR keyword print-color-mode-default monochrome
ATTR boolean color-supported false
ATTR keyword sides-supported one-sided
ATTR keyword sides-default one-sided
ATTR keyword media-default iso_a4_210x297mm
ATTR keyword media-ready iso_a4_210x297mm
ATTR keyword media-supported iso_a4_210x297mm,iso_a5_148x210mm,iso_a6_105x148mm,jis_b5_182x257mm,jis_b6_128x182mm,na_letter_8.5x11in,na_legal_8.5x14in,na_executive_7.25x10.5in,iso_dl_110x220mm,iso_c5_162x229mm,iso_c6_114x162mm,na_number-10_4.125x9.5in,na_monarch_3.875x7.5in
ATTR integer media-left-margin-supported 380
ATTR integer media-right-margin-supported 380
ATTR integer media-top-margin-supported 530
ATTR integer media-bottom-margin-supported 530
# ippeveprinter checks incoming jobs against this list (1/100 mm, same order as media-supported).
ATTR collection media-size-supported
{
    MEMBER integer x-dimension 21000
    MEMBER integer y-dimension 29700
},
{
    MEMBER integer x-dimension 14800
    MEMBER integer y-dimension 21000
},
{
    MEMBER integer x-dimension 10500
    MEMBER integer y-dimension 14800
},
{
